<!DOCTYPE html>
<html lang="en" class="bg-[#0A0B0E] text-white">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HALT Visual Identity</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@700;900&display=swap" rel="stylesheet">
</head>
<body class="min-h-screen bg-[#0A0B0E] flex flex-col items-center justify-center p-6 font-['JetBrains_Mono']">

    <!-- ANA GÖRSEL VE LOGO ODAK KARTI -->
    <div class="relative group flex flex-col items-center justify-center p-12 rounded-3xl bg-[#12141A] border border-[#1E222D] shadow-[0_0_50px_rgba(255,85,0,0.15)] max-w-xl w-full">

        <!-- Arka Plan Turuncu Parlama Efekti -->
        <div class="absolute -top-10 left-1/2 -translate-x-1/2 w-48 h-48 bg-[#FF5500] opacity-20 blur-[80px] pointer-events-none rounded-full"></div>

        <!-- LOGO SİSTEMİ (H △ L T) -->
        <div class="flex items-center gap-4 text-5xl sm:text-6xl font-black tracking-[0.2em] text-white select-none z-10">
            <span>H</span>

            <!-- TAM ORTADAKİ İKONİK KALKAN / PAUSE İKONU -->
            <div class="relative flex items-center justify-center w-14 h-16 drop-shadow-[0_0_20px_rgba(255,85,0,0.8)]">
                <svg viewBox="0 0 32 38" fill="none" xmlns="http://www.w3.org/2000/svg" class="w-full h-full">
                    <!-- Turuncu Kalkan Tabanı -->
                    <path d="M16 2L3 6V18C3 26.5 9.5 33.5 16 36C22.5 33.5 29 26.5 29 18V6L16 2Z" fill="#FF5500" stroke="#FF7722" stroke-width="2" stroke-linejoin="round"/>

                    <!-- İç Gölgeleme Katmanı -->
                    <path d="M16 5.5L6 8.5V17.5C6 23.8 11 29.5 16 31.5C21 29.5 26 23.8 26 17.5V8.5L16 5.5Z" fill="#0A0B0E" opacity="0.3"/>

                    <!-- Dikey Beyaz Pause (||) Çizgileri -->
                    <rect x="11.5" y="13" width="3" height="10" rx="1.5" fill="#FFFFFF"/>
                    <rect x="17.5" y="13" width="3" height="10" rx="1.5" fill="#FFFFFF"/>
                </svg>
            </div>

            <span>L</span>
            <span>T</span>
        </div>

        <p class="mt-8 text-xs text-slate-400 tracking-widest uppercase">The On-Chain Pause Protocol</p>
    </div>

</body>
</html>
